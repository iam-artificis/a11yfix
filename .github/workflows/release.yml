name: Release

# Publishing runs from CI rather than from a laptop for one reason that is not
# convenience: the registry authenticates this workflow by the OIDC identity GitHub mints
# for it. There is no npm token in this repository — nothing to rotate, nothing to leak,
# and nothing a stolen laptop can publish with.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  # The same matrix the branch gets. A tag is not a reason to publish something that was
  # never run on Windows: the diff round-trip is where line endings break a patch.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  # The tag and the version in package.json disagreeing is how a v0.2.0 release ends up
  # containing 0.1.0. Checked before anything is published, not after.
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "$TAG matches package.json"

  publish:
    needs: [test, version-matches-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole credential. npm exchanges this short-lived token for publish rights,
      # which is why there is no secret anywhere in this file.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly builds, but building here as well means a failure is attributed to
      # the build rather than to the publish.
      - run: npm run build
      # Trusted publishing needs npm 11.5.1 or newer. Checked rather than assumed: an
      # older npm skips the OIDC exchange and goes looking for a token that is
      # deliberately not here any more, and what it then prints is about credentials
      # rather than about the version, which sends you looking in the wrong place.
      #
      # Compared in node rather than in the shell: `sort -V` wants a two-line string, and
      # a release workflow is a bad place to discover that an escape did not survive.
      - name: npm is new enough for trusted publishing
        run: |
          node -e "
            const NEED = [11, 5, 1];
            const version = process.argv[1];
            const have = version.split('.').map((p) => parseInt(p, 10) || 0);
            let older = false;
            for (let i = 0; i < NEED.length; i++) {
              const h = have[i] ?? 0;
              if (h > NEED[i]) break;
              if (h < NEED[i]) { older = true; break; }
            }
            if (older) {
              console.error('::error::npm ' + version + ' is too old for trusted publishing; need 11.5.1 or newer.');
              process.exit(1);
            }
            console.log('npm ' + version);
          " "$(npm --version)"
      # The trusted publisher configured on npmjs.com names this repository AND this
      # filename, release.yml. Renaming this file stops publishing working until the npm
      # side is renamed with it, which is worth knowing before you tidy up.
      #
      # `--provenance` is deliberately absent: under trusted publishing the attestation is
      # produced automatically, and passing the flag on top of that is how a release you
      # are already halfway through fails on an argument error.
      - name: Publish to npm
        run: npm publish --access public

  # `uses: iam-artificis/a11yfix@v1` has to keep resolving, and it must never point at a
  # commit whose npm package does not exist yet — the action shells out to
  # `npx a11yfix@latest`, so a v1 that moves before the publish succeeds is worse than a
  # v1 that does not move at all. Hence: after publish, never beside it.
  #
  # ACTION_MAJOR is not derived from the package version, and that is deliberate. The tag
  # a workflow pins names the action's input contract — path, mode, level, token — which
  # has its own compatibility story: the package can go 0.1.0 to 0.9.0 without any of
  # those inputs changing. Deriving it would put the action on `v0` today and move every
  # consumer's pin on the first minor release, which is the opposite of what a major tag
  # is for. Raise it by hand, in the same commit that breaks an input.
  move-major-tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ACTION_MAJOR: v1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Point the major tag at this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$ACTION_MAJOR" "$TAG"
          git push -f origin "$ACTION_MAJOR"
          echo "$ACTION_MAJOR now points at $TAG"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Draft the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md --verify-tag
