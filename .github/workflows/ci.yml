name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The diff round-trip runs real `git apply`, and line endings are exactly the
        # thing that breaks a patch, so Windows is not optional here.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  coverage-doc-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run docs
      # docs/coverage.md is generated from the rule set. If it has drifted, the
      # repository is making a coverage claim the code does not support.
      - name: Fail if docs/coverage.md is stale
        run: git diff --exit-code docs/coverage.md

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      # demo/ is a deliberately broken fixture. A non-zero exit is the CLI reporting that
      # findings remain, which is the expected result here, so the assertion is on what it
      # produced rather than on the exit code.
      - name: The demo produces a patch
        run: |
          node dist/cli.js demo --diff --include-review > demo.patch || true
          test -s demo.patch || { echo "no patch produced for a fixture that should fail"; exit 1; }
          echo "patch is $(wc -l < demo.patch) lines"

      # The whole promise of the tool in one step: a patch it emitted applies cleanly to
      # the files it was generated from.
      - name: The patch applies
        run: |
          git apply --check demo.patch
          git apply demo.patch
          git diff --stat

      - name: And the patched fixture is clean of what was patched
        run: |
          node dist/cli.js demo --json > after.json
          node -e "
            const r = require('./after.json');
            const left = r.byRule.filter(x => x.ruleId === 'A11Y-COLOR-001');
            if (left.length > 0) {
              console.error('contrast findings survived their own patch:', JSON.stringify(left));
              process.exit(1);
            }
            console.log('no contrast findings remain');
          "
