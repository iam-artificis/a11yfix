name: CI

# Nothing here writes back to GitHub: the three jobs read the checkout and run node.
# Stated rather than inherited, so the token this workflow gets does not depend on an
# account-wide default that can be changed elsewhere.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The diff round-trip runs real `git apply`, and line endings are exactly the
        # thing that breaks a patch, so Windows is not optional here.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  coverage-doc-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run docs
      # docs/coverage.md is generated from the rule set. If it has drifted, the
      # repository is making a coverage claim the code does not support.
      - name: Fail if docs/coverage.md is stale
        run: git diff --exit-code docs/coverage.md

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      # The report is the only output a non-developer ever sees. Its two promises are
      # that it opens with nothing fetched and that it accounts for every finding, so
      # both are checked rather than asserted in the README.
      - name: The report is self-contained and complete
        run: |
          node dist/cli.js demo --report report.html --all --quiet || true
          test -s report.html || { echo "no report produced"; exit 1; }
          node dist/cli.js demo --json --all > all.json || true
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('report.html', 'utf8');
            const run = JSON.parse(fs.readFileSync('all.json', 'utf8'));
            const findings = run.files.flatMap(f => f.violations);

            for (const tag of [/<script/i, /<link\b/i, /<img\b/i]) {
              if (tag.test(html)) { console.error('report fetches something:', tag); process.exit(1); }
            }
            // Only what the browser would actually fetch or navigate to counts: attribute
            // values and CSS url(). The report quotes source, and quoted source may itself
            // contain a URL as escaped text inside <pre> — scanning the raw bytes reports
            // the fixture's own <iframe src> as a reference the report fetches, which it is
            // not, and the check then fails on the tool working correctly.
            const attrRefs = [...html.matchAll(/(?:href|src|srcset|action|formaction|poster|background)\s*=\s*\"([^\"]*)\"/gi)].map(m => m[1]);
            const cssRefs = [...html.matchAll(/url\(\s*[\"']?([^)\"']+)/gi)].map(m => m[1]);
            if (/@import/i.test(html)) { console.error('report imports a stylesheet'); process.exit(1); }
            for (const url of [...attrRefs, ...cssRefs]) {
              if (/^[a-z][a-z0-9+.-]*:/i.test(url) && !url.startsWith('https://www.w3.org/')) {
                console.error('unexpected external reference:', url); process.exit(1);
              }
            }
            const missing = [...new Set(findings.map(f => f.ruleId))].filter(id => !html.includes(id));
            if (missing.length > 0) {
              console.error('rules reported but absent from the report:', missing.join(', '));
              process.exit(1);
            }
            console.log('report covers ' + findings.length + ' findings, fetches nothing');
          "

      # demo/ is a deliberately broken fixture. A non-zero exit is the CLI reporting that
      # findings remain, which is the expected result here, so the assertion is on what it
      # produced rather than on the exit code.
      - name: The demo produces a patch
        run: |
          node dist/cli.js demo --diff --include-review > demo.patch || true
          test -s demo.patch || { echo "no patch produced for a fixture that should fail"; exit 1; }
          echo "patch is $(wc -l < demo.patch) lines"

      # The whole promise of the tool in one step: a patch it emitted applies cleanly to
      # the files it was generated from.
      - name: The patch applies
        run: |
          git apply --check demo.patch
          git apply demo.patch
          git diff --stat

      - name: And the patched fixture is clean of what was patched
        run: |
          node dist/cli.js demo --json > after.json
          node -e "
            const r = require('./after.json');
            const left = r.byRule.filter(x => x.ruleId === 'A11Y-COLOR-001');
            if (left.length > 0) {
              console.error('contrast findings survived their own patch:', JSON.stringify(left));
              process.exit(1);
            }
            console.log('no contrast findings remain');
          "
