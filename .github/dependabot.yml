# There are no runtime dependencies and there will not be any, so this watches the two
# things that can still go stale: the build-time toolchain and the actions CI pins.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev:
        patterns: ["*"]
    # Major versions of the two build-time packages are held back deliberately. The
    # first automatic proposal was TypeScript 5 to 7 with @types/node 24 to 26, and it
    # failed every job: under that pair the compiler no longer sees URL, fetch,
    # TextDecoder or AbortSignal, so src/fetch.ts stops type-checking in twenty places.
    # That is a migration somebody has to sit down and do, not a bump to merge on a
    # Monday, and a pull request that can never go green is worse than no pull request.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
